  <title id="title">FileSquid logo — Option 03: happy eyes</title>
  <desc id="desc">White FileSquid logo with a rounded head, two simple eyes, one large curled arm and one small leg on each side, and a folder-shaped belly with a flush-left tab cut into the body. Dark rounded-square background with transparent outer corners. Eyes are negative-space cutouts. All artwork consists of editable vector paths.</desc>
